version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: watchlist_user
      POSTGRES_PASSWORD: watchlist_pass
      POSTGRES_DB: watchlist_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: